[project]
name = "mado-backend"
version = "0.1.0"
description = "Mado platform backend - AI urban experience discovery"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "geoalchemy2>=0.16",
    "pgvector>=0.3",
    "redis>=5.2",
    # Image uploads are decoded and re-encoded rather than trusted.
    "pillow>=11",
    "meilisearch-python-sdk>=3.4",
    "httpx>=0.28",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.17",
    "structlog>=24.4",
    # CLDR reference data: which currency a country uses, and which time zones it
    # spans. Needed because a city row is now materialised from wherever somebody
    # drops a pin rather than typed in by a developer, and both fields have to be
    # filled for a country nobody anticipated. Hand-written tables were the
    # alternative and would be wrong within a year - currencies get redenominated
    # and zones get split.
    "babel>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 flags function calls in argument defaults, which is exactly how FastAPI
# declares Query/Depends/Header. The rule does not apply to this framework.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
